[project]
name = "mcp-kubernetes"
version = "0.1.0"
description = "Read-only Kubernetes MCP server for stdio and Streamable HTTP"
readme = "README.md"
authors = [
    { email = "renardiarvy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "kubernetes>=36.0.3",
    "mcp==2.2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.8",
    "watchfiles>=1.3.0",
]

[tool.uv]
package = false
